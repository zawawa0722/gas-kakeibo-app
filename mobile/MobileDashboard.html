<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<style>
  :root {
    color-scheme: light;
    --ink: #102641;
    --paper: #f1edfc;
    --teal: #5135ad;
    --budget: #00756e;
    --line: #ded7ef;
    --hero: linear-gradient(140deg, #7446bc, #39369e);
    --warning: #b63842;
    --nav-height: 68px;
    font: 16px/1.5 system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  :root[data-theme="sage"] {
    --paper: #e9f5ee; --teal: #246746; --budget: #246746; --line: #cfe4d8;
    --hero: linear-gradient(140deg, #43835c, #226556);
  }
  :root[data-theme="ocean"] {
    --paper: #e6f8fa; --teal: #005e9d; --budget: #005e9d; --line: #cce7ed;
    --hero: linear-gradient(140deg, #007f91, #0956ad);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: -3px; }
  button:disabled { cursor: default; color: #586678; }
  h1, h2, p { margin: 0; }
  .app { max-width: 520px; margin: auto; min-height: 100dvh; background: var(--paper); }
  header { position: relative; text-align: center; border-bottom: 1px solid var(--line); padding: 10px 56px; }
  h1 { font-size: 1.65rem; }
  .settings { position: absolute; top: 5px; right: 12px; width: 44px; height: 44px; font-size: 1.45rem; }
  main { padding: 0 12px calc(var(--nav-height) + env(safe-area-inset-bottom) + 16px); }
  .notice { font-size: .75rem; text-align: center; color: #586678; padding-top: 6px; }
  .month { display: flex; justify-content: center; align-items: center; gap: 12px; }
  .month button { width: 44px; height: 44px; font-size: 1.8rem; color: var(--teal); }
  #month-label { font-size: 1.35rem; font-weight: 800; }
  .summary {
    overflow: hidden; border-radius: 18px; padding: 12px 8px 8px; color: white;
    background: var(--hero);
  }
  .balance { text-align: center; padding-bottom: 9px; font-weight: 700; }
  #balance { display: block; font-size: clamp(2rem, 9vw, 2.9rem); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; border-radius: 13px; overflow: hidden; }
  .metric { text-align: left; padding: 7px 9px; color: white; min-width: 0; }
  .metric + .metric { border-left: 1px solid #ffffff80; }
  .metrics { border-top: 1px solid #ffffff80; }
  .metric strong { display: block; font-size: clamp(1rem, 4.6vw, 1.45rem); overflow-wrap: anywhere; }
  section + section { margin-top: 16px; }
  .heading { display: flex; justify-content: space-between; align-items: center; min-height: 36px; gap: 8px; }
  h2 { font-size: 1.13rem; }
  .link { min-height: 44px; color: var(--teal); font-weight: 700; font-size: .85rem; }
  .list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .list:empty { display: none; }
  .list li + li { border-top: 1px solid var(--line); }
  .row { width: 100%; min-height: 44px; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; gap: 8px; align-items: center; text-align: left; padding: 7px 10px; }
  .row .date, .row .amount { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .title { overflow-wrap: anywhere; }
  .chevron { color: #536170; }
  #dashboard { margin-top: 12px; }
  .panel { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .panel + .panel { margin-top: 10px; }
  .budget-amount { font-size: 1.55rem; color: var(--budget); }
  .caption { color: #526071; font-size: .85rem; }
  .meter { display: flex; align-items: center; gap: 8px; color: var(--budget); font-weight: 700; }
  progress { flex: 1; min-width: 0; accent-color: var(--budget); }
  .warning { color: var(--warning); }
  .figures { list-style: none; padding: 0; margin: 0; }
  .figures li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; }
  .figures li + li { border-top: 1px solid var(--line); }
  .figures li span { flex: 1; min-width: 4em; overflow-wrap: anywhere; }
  .figures strong { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .installment-totals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .installment-totals strong { display: block; color: var(--ink); font-size: 1.15rem; }
  .trend { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; }
  .trend-month { font-size: .8rem; }
  .trend-month small { display: block; min-height: 1.25em; }
  .plot { position: relative; height: 100px; }
  .plot::after { content: ''; position: absolute; inset: 50% 0 auto; border-top: 1px solid #526071; }
  .bar { position: absolute; inset: auto 18% 50%; background: var(--teal); border-radius: 4px 4px 0 0; }
  .bar.negative { inset: 50% 18% auto; background: var(--warning); border-radius: 0 0 4px 4px; }
  .bar.partial { background: transparent; border: 2px solid var(--teal); }
  .bar.partial.negative { border-color: var(--warning); }
  .setting-row select { margin-left: auto; font: inherit; min-height: 44px; }
  nav { position: fixed; inset: auto 0 0; max-width: 520px; margin: auto; background: var(--paper); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav button { min-height: var(--nav-height); font-size: .82rem; font-weight: 700; }
  nav [aria-current] { color: var(--teal); }
  nav svg { width: 25px; height: 25px; display: block; margin: 0 auto 2px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .camera { display: block; width: 44px; padding: 3px; margin: 0 auto 2px; border-radius: 8px; background: var(--teal); color: white; }
  .camera svg { margin: auto; }
  dialog { color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; width: min(92vw, 460px); max-height: 80dvh; padding: 16px; }
  dialog::backdrop { background: #10264180; }
  #dialog-content { margin: 12px 0; }
  .setting-row { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .empty { padding: 10px; color: #526071; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>家計簿</h1>
    <button class="settings" id="settings" type="button" aria-label="ホーム表示設定">⚙</button>
  </header>
  <main>
    <p class="notice" id="data-status" role="status">サンプルデータ</p>
    <div class="month">
      <button id="previous" type="button" aria-label="前月">‹</button>
      <span id="month-label" aria-live="polite"></span>
      <button id="next" type="button" aria-label="翌月">›</button>
    </div>
    <section id="summary" class="summary" aria-label="月の収支">
      <div class="balance">収支差額 <strong id="balance"></strong></div>
      <div class="metrics">
        <button class="metric income" id="income" type="button">収入 ›<strong id="income-total"></strong></button>
        <button class="metric expense" id="expense" type="button">支出 ›<strong id="expense-total"></strong></button>
      </div>
    </section>
    <div id="dashboard" hidden>
      <section class="panel" id="budget-panel" aria-labelledby="budget-heading">
        <h2 id="budget-heading">変動費予算</h2>
        <div id="budget-content"></div>
      </section>
      <section class="panel" id="category-panel" aria-labelledby="category-heading">
        <div class="heading">
          <h2 id="category-heading"></h2>
          <button class="link" id="categories" type="button">費目別を見る ›</button>
        </div>
        <ul class="figures" id="category-content"></ul>
      </section>
      <section class="panel" aria-labelledby="installment-heading">
        <div class="heading">
          <h2 id="installment-heading">分割払い</h2>
          <button class="link" id="installments" type="button">支払い予定を見る ›</button>
        </div>
        <div id="installment-content"></div>
      </section>
      <section class="panel" aria-labelledby="trend-heading">
        <div class="heading">
          <h2 id="trend-heading">直近6か月の収支差額</h2>
          <button class="link" id="actuals" type="button">月別実績を見る ›</button>
        </div>
        <div id="trend" class="trend"></div>
      </section>
    </div>
  </main>
  <nav aria-label="メインメニュー">
    <button type="button" id="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M6 10v11h5v-6h3v6h4V10"/></svg>ホーム</button>
    <button type="button" disabled><span class="camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5l2-3h4l2 3h5v13H3z"/><circle cx="12" cy="13" r="4"/></svg></span>レシート登録</button>
    <button type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 3"/></svg>登録履歴</button>
  </nav>
</div>
<dialog id="detail" aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <div id="dialog-content"></div>
  <form method="dialog"><button class="link">閉じる</button></form>
</dialog>
<script>
  'use strict';

  const byId = id => document.getElementById(id);
  const yen = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' });
  const formatYen = amount => yen.format(amount).replace('￥', '¥');
  const signedYen = amount => (amount > 0 ? '+' : '') + formatYen(amount);
  const monthNumber = month => month % 12 + 1;
  const monthName = month => Math.floor(month / 12) + '年' + monthNumber(month) + '月';
  const monthKey = month => Math.floor(month / 12) + '-' + String(monthNumber(month)).padStart(2, '0');
  const monthIndex = key => {
    const [year, month] = key.split('-').map(Number);
    return year * 12 + month - 1;
  };
  const live = typeof google !== 'undefined' && Boolean(google.script?.run);
  const today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo' }).format(new Date());
  const demoMonth = 2026 * 12 + 10;
  const currentMonth = live ? monthIndex(today.slice(0, 7)) : demoMonth;
  const themes = { sage: 'やさしい緑', ocean: '沖縄の海', contrast: 'メリハリ' };
  const preferenceKey = 'kakeibo-dashboard-theme';
  let selectedMonth = currentMonth;
  let requestId = 0;
  let theme = 'contrast';

  try {
    const saved = localStorage.getItem(preferenceKey);
    if (Object.hasOwn(themes, saved)) theme = saved;
  } catch {
    // ブラウザーの保存領域が使えない場合は既定色で表示する。
  }
  document.documentElement.dataset.theme = theme;

  function element(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    node.textContent = text;
    return node;
  }

  function sum(rows) {
    return rows.reduce((total, row) => total + row.amount, 0);
  }

  function listItem(list, css, children, action) {
    const item = document.createElement('li');
    const button = element('button', 'row ' + css, '');
    button.type = 'button';
    const arrow = element('span', 'chevron', '›');
    arrow.setAttribute('aria-hidden', 'true');
    button.append(...children, arrow);
    button.addEventListener('click', action);
    item.append(button);
    list.append(item);
  }

  function openDialog(title, content) {
    byId('dialog-title').textContent = title;
    byId('dialog-content').replaceChildren(content);
    if (!byId('detail').open) byId('detail').showModal();
  }

  function transactionList(list, rows, month) {
    list.replaceChildren();
    for (const row of rows) {
      listItem(list, '', [
        element('span', 'date', row.kind),
        element('span', 'title', row.name),
        element('strong', 'amount', formatYen(row.amount))
      ], () => openDialog(row.name, element('p', '', [
        monthName(month), row.category, formatYen(row.amount)
      ].join('　'))));
    }
  }

  function showTransactions(rows, month, title) {
    const content = document.createElement('div');
    content.append(element('p', 'empty', rows.length
      ? rows.length + '件　合計 ' + formatYen(rows.length && rows.every(row => row.kind === '支出') ? -sum(rows) : sum(rows))
      : '該当する内訳はありません。'));
    const list = element('ul', 'list', '');
    transactionList(list, rows, month);
    content.append(list);
    openDialog(title, content);
  }

  function renderSettings() {
    const label = element('label', 'setting-row', '配色テーマ');
    const select = document.createElement('select');
    for (const [id, name] of Object.entries(themes)) {
      const option = element('option', '', name);
      option.value = id;
      select.append(option);
    }
    select.value = theme;
    select.addEventListener('change', () => {
      theme = select.value;
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem(preferenceKey, theme);
      } catch {
        // 保存領域を利用できない場合も現在の画面には反映する。
      }
    });
    label.append(select);
    openDialog('ホーム表示設定', label);
  }

  function expenseGroups(rows) {
    const groups = new Map();
    for (const row of rows.filter(row => row.kind === '支出')) {
      if (!groups.has(row.category)) groups.set(row.category, []);
      groups.get(row.category).push(row);
    }
    return groups;
  }

  function renderBudget(data) {
    const { budget, errors } = data;
    byId('budget-panel').hidden = !budget && !errors.budget;
    const content = byId('budget-content');
    content.replaceChildren();
    if (!budget) {
      if (errors.budget) content.append(element('p', 'empty', errors.budget));
      return;
    }
    const remaining = budget.limit - budget.used;
    content.append(element('strong', 'budget-amount' + (remaining < 0 ? ' warning' : ''),
      (remaining < 0 ? '超過 ' : '残り ') + formatYen(Math.abs(remaining))));
    content.append(element('p', 'caption', '予算 ' + formatYen(budget.limit) +
      '　使用済み ' + formatYen(budget.used) + (budget.planned ? '' : '（収入実績ベース）')));
    if (budget.limit > 0) {
      const percent = Math.max(0, Math.round(budget.used / budget.limit * 100));
      const progress = document.createElement('progress');
      progress.max = 100;
      progress.value = Math.min(percent, 100);
      progress.setAttribute('aria-label', '変動費予算の使用率');
      const meter = element('div', 'meter', '');
      meter.append(progress, element('span', remaining < 0 ? 'warning' : '', percent + '%'));
      content.append(meter);
    }
  }

  function renderCategories(data, month) {
    const groups = expenseGroups(data.rows);
    const previous = data.previousRows === null ? null : expenseGroups(data.previousRows);
    const ranked = [...groups].map(([name, rows]) => {
      const amount = -sum(rows);
      return { name, rows, amount, increase: previous ? amount + sum(previous.get(name) || []) : null };
    });
    const byAmount = [...ranked].sort((a, b) => b.amount - a.amount);
    const top = previous
      ? ranked.filter(row => row.increase > 0).sort((a, b) => b.increase - a.increase)
      : byAmount.filter(row => row.amount > 0 && !data.fixedCategories.includes(row.name));
    byId('category-heading').textContent = previous ? '前月より増えた支出' : '変動費の支出上位';
    byId('category-panel').hidden = !data.available;
    const list = byId('category-content');
    list.replaceChildren();
    for (const row of top.slice(0, 3)) {
      const item = element('li', '', '');
      item.append(element('span', '', row.name), element('strong', '', formatYen(row.amount)));
      if (previous) item.append(element('strong', 'warning', signedYen(row.increase)));
      list.append(item);
    }
    if (!top.length) list.append(element('li', 'empty', previous ? '前月より増えた費目はありません。' : '変動費の支出はありません。'));
    byId('categories').disabled = !ranked.length;
    byId('categories').onclick = () => {
      const details = element('ul', 'list', '');
      for (const row of byAmount) {
        listItem(details, '', [
          element('span', '', ''), element('span', 'title', row.name),
          element('strong', 'amount', formatYen(row.amount))
        ], () => showTransactions(row.rows, month, row.name));
      }
      openDialog('費目別支出', details);
    };
  }

  function renderInstallments(data) {
    const plan = data.installments;
    const content = byId('installment-content');
    const button = byId('installments');
    content.replaceChildren();
    button.disabled = !plan?.items.length;
    if (!plan) {
      content.append(element('p', 'empty', data.errors.installments || '分割払い管理シートがありません。'));
      return;
    }
    const totals = element('div', 'installment-totals', '');
    for (const [label, amount] of [['来月（' + monthNumber(monthIndex(plan.nextMonth)) + '月）', plan.next], ['未払い総額（予定）', plan.remaining]]) {
      const column = element('div', 'caption', label);
      column.append(element('strong', '', formatYen(amount)));
      totals.append(column);
    }
    content.append(totals);
    button.onclick = () => {
      const list = element('ul', 'figures', '');
      for (const item of plan.items) {
        list.append(element('li', '', item.name + '　来月 ' + formatYen(item.next) +
          ' ／ 未払い ' + formatYen(item.remaining)));
      }
      openDialog('分割払いの支払い予定', list);
    };
  }

  function renderTrend(actuals) {
    const trend = byId('trend');
    const max = Math.max(1, ...actuals.map(item => Math.abs(item.balance ?? 0)));
    trend.replaceChildren();
    for (const item of actuals) {
      const month = monthIndex(item.month);
      const value = item.balance === null ? 'データなし' : signedYen(item.balance);
      const column = element('div', 'trend-month', '');
      column.setAttribute('role', 'img');
      column.setAttribute('aria-label', monthName(month) + ' ' + value + (item.partial ? ' 集計途中' : ''));
      const plot = element('div', 'plot', '');
      if (item.balance !== null) {
        const bar = element('div', 'bar' + (item.balance < 0 ? ' negative' : '') +
          (item.partial ? ' partial' : ''), '');
        bar.style.height = Math.max(2, Math.abs(item.balance) / max * 46) + 'px';
        plot.append(bar);
      }
      column.append(plot, element('span', '', monthNumber(month) + '月'),
        element('small', '', item.balance === null ? '—' : item.partial ? '途中' : ''));
      trend.append(column);
    }
    byId('actuals').onclick = () => {
      const list = element('ul', 'figures', '');
      for (const item of actuals) {
        const label = monthName(monthIndex(item.month)) + (item.partial ? '（途中）' : '');
        const row = element('li', '', '');
        row.append(element('span', '', label), element('strong', item.balance < 0 ? 'warning' : '',
          item.balance === null ? 'データなし' : signedYen(item.balance)));
        list.append(row);
      }
      openDialog('月別実績', list);
    };
  }

  function render(data, month) {
    const income = data.rows.filter(row => row.kind === '収入');
    const expense = data.rows.filter(row => row.kind === '支出');
    byId('summary').hidden = !data.available;
    byId('balance').textContent = signedYen(sum(data.rows));
    byId('income-total').textContent = formatYen(sum(income));
    byId('expense-total').textContent = formatYen(-sum(expense));
    byId('income').onclick = () => showTransactions(income, month, monthName(month) + 'の収入');
    byId('expense').onclick = () => showTransactions(expense, month, monthName(month) + 'の支出');
    renderBudget(data);
    renderCategories(data, month);
    renderInstallments(data);
    renderTrend(data.actuals);
    byId('dashboard').hidden = false;
  }

  function demoData(month) {
    const months = [51000, 76000, -34000, 54000, 92000, 82400];
    const actuals = Array.from({ length: 6 }, (_, index) => {
      const key = month - 5 + index;
      return { month: monthKey(key), balance: months[key - demoMonth + 5] ?? null, partial: key === demoMonth };
    });
    const rows = [
      ['収入', '給与', 350000], ['支出', '家賃', -155000], ['支出', '通信費', -8000],
      ['支出', '分割費', -14630], ['支出', 'ローン', -15370], ['支出', '食品', -48200],
      ['支出', '生活用品', -12300], ['支出', '外食', -9800], ['支出', '交通', -4300]
    ].map(([kind, category, amount]) => ({ kind, category, name: category, amount }));
    return {
      rows: month === demoMonth ? rows : [],
      available: month === demoMonth, previousRows: null, actuals, errors: {},
      fixedCategories: ['家賃', '通信費', '分割費', 'ローン'],
      budget: month === demoMonth ? { limit: 157000, used: 74600, planned: true } : null,
      installments: {
        nextMonth: monthKey(demoMonth + 1), next: 14630, remaining: 87780,
        items: [{ name: '家電', next: 14630, remaining: 87780 }]
      }
    };
  }

  async function refresh() {
    const month = selectedMonth;
    const request = ++requestId;
    const status = byId('data-status');
    byId('month-label').textContent = monthName(month);
    byId('next').disabled = month >= currentMonth;
    byId('summary').hidden = true;
    byId('dashboard').hidden = true;
    status.textContent = live ? '読み込み中…' : 'サンプルデータ';
    try {
      const data = live ? await new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
          .getMobileDashboardOverview(monthKey(month));
      }) : demoData(month);
      if (request !== requestId) return;
      if (live) status.textContent = data.available ? '' : 'この月の家計簿データはありません。';
      render(data, month);
    } catch (error) {
      if (request === requestId) status.textContent = error?.message || '家計簿を読み込めませんでした。';
    }
  }

  byId('previous').addEventListener('click', () => { selectedMonth -= 1; refresh(); });
  byId('next').addEventListener('click', () => { selectedMonth += 1; refresh(); });
  byId('home').addEventListener('click', () => window.scrollTo(0, 0));
  byId('settings').addEventListener('click', renderSettings);
  refresh();
</script>
</body>
</html>
